name: ci

on:
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/edinaprado/demo-app

jobs:
  build-and-update-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Atualiza a tag no overlay dev
        run: |
          cd apps/demo-app/overlays/dev
          kustomize edit set image nginx=${{ env.IMAGE }}:${{ github.sha }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: dev usa ${{ github.sha }}"
          git push
